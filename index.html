<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaFetch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: #08090d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .18;
    }

    .o1 {
      background: #ff2f92;
      top: -180px;
      left: -120px;
    }

    .o2 {
      background: #7c3cff;
      right: -150px;
      bottom: -180px;
    }

    .card {
      width: min(760px, 100%);
      position: relative;
      z-index: 2;
      border: 1px solid #252936;
      background: rgba(15, 16, 23, .88);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 42px;
    }

    .logo-mark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ffb000, #ff277f, #813cff);
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 68px);
      letter-spacing: -2.8px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #ffb000, #ff277f, #813cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      color: #9296a5;
      max-width: 560px;
      margin: auto;
      line-height: 1.6;
      font-size: 15px;
    }

    .form {
      margin-top: 32px;
      display: flex;
      gap: 10px;
      padding: 7px;
      background: #0a0b10;
      border: 1px solid #292d35;
      border-radius: 16px;
    }

    .form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      padding: 14px;
      font-size: 15px;
    }

    .form input::placeholder {
      color: #626775;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 19px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .paste {
      background: #20232c;
      color: white;
    }

    .paste:hover {
      background: #2b2f39;
    }

    .download {
      background: linear-gradient(135deg, #ff2d8d, #7c3cff);
      color: white;
    }

    .download:hover {
      transform: translateY(-1px);
      opacity: .92;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      min-height: 24px;
      text-align: center;
      color: #9296a5;
      font-size: 13px;
      margin-top: 14px;
    }

    .result {
      display: none;
      margin-top: 28px;
      border: 1px solid #292d35;
      background: #0b0c11;
      border-radius: 18px;
      padding: 18px;
    }

    .result.show {
      display: block;
    }

    .preview {
      background: #15171e;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .preview video {
      display: block;
      width: 100%;
      max-height: 650px;
      object-fit: contain;
      background: #000;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .actions button,
    .actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
    }

    .download-reel {
      display: block;
      background: linear-gradient(135deg, #ff2d8d, #7c3cff);
      color: white;
      border-radius: 11px;
      padding: 13px 19px;
      font-size: 14px;
      font-weight: 700;
    }

    .reset {
      background: #20232c;
      color: white;
      border-radius: 11px;
      padding: 13px 19px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .note {
      text-align: center;
      color: #626775;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px;
        border-radius: 22px;
      }

      .form {
        flex-wrap: wrap;
      }

      .form input {
        flex-basis: 100%;
      }

      .form button {
        flex: 1;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
  </div>

  <main class="card">

    <div class="logo">
      <div class="logo-mark"></div>
      InstaFetch
    </div>

    <section class="hero">
      <h1>Download your <span>video.</span></h1>

      <p>
        Paste a public Instagram Reel URL and get your video ready to download.
      </p>

      <div class="form">
        <input
          id="urlInput"
          type="url"
          placeholder="Paste your Instagram Reel URL..."
          autocomplete="off"
        >

        <button class="paste" id="pasteBtn" type="button">
          Paste
        </button>

        <button class="download" id="downloadBtn" type="button">
          Download
        </button>
      </div>

      <div class="status" id="status"></div>
    </section>

    <section class="result" id="result">

      <div class="preview">
        <video id="videoPreview" controls playsinline></video>
      </div>

      <div class="actions">

        <a
          id="downloadReel"
          class="download-reel"
          href="#"
          target="_blank"
          rel="noopener"
          download
        >
          Download Reel
        </a>

        <button
          id="resetBtn"
          class="reset"
          type="button"
        >
          Reset
        </button>

      </div>

    </section>

    <p class="note">
      Only publicly accessible Instagram Reel URLs are supported.
      Availability depends on what Instagram exposes from the public page.
    </p>

  </main>

  <script>
    const urlInput = document.getElementById("urlInput");
    const pasteBtn = document.getElementById("pasteBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");
    const result = document.getElementById("result");
    const videoPreview = document.getElementById("videoPreview");
    const downloadReel = document.getElementById("downloadReel");
    const status = document.getElementById("status");

    pasteBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        if (!text) {
          status.textContent = "Clipboard is empty.";
          return;
        }

        urlInput.value = text.trim();
        status.textContent = "URL pasted.";
      } catch (error) {
        urlInput.focus();
        status.textContent = "Please paste the URL manually.";
      }
    });

    downloadBtn.addEventListener("click", async () => {
      const permalink = urlInput.value.trim();

      if (!permalink) {
        status.textContent = "Please enter an Instagram Reel URL.";
        urlInput.focus();
        return;
      }

      downloadBtn.disabled = true;
      pasteBtn.disabled = true;
      status.textContent = "Fetching your Reel...";

      result.classList.remove("show");
      videoPreview.removeAttribute("src");
      videoPreview.load();

      try {
        const response = await fetch(
          "/api/media?permalink=" + encodeURIComponent(permalink)
        );

        const data = await response.json();

        if (!response.ok || !data.success || !data.videoUrl) {
          throw new Error(
            data.error || "Unable to fetch this Reel."
          );
        }

        videoPreview.src = data.videoUrl;
        downloadReel.href = data.videoUrl;

        result.classList.add("show");
        status.textContent = "Your Reel is ready.";

        videoPreview.load();

      } catch (error) {
        status.textContent =
          error.message || "Something went wrong. Please try again.";
      } finally {
        downloadBtn.disabled = false;
        pasteBtn.disabled = false;
      }
    });

    resetBtn.addEventListener("click", () => {
      urlInput.value = "";
      videoPreview.pause();
      videoPreview.removeAttribute("src");
      videoPreview.load();

      downloadReel.href = "#";

      result.classList.remove("show");
      status.textContent = "";

      urlInput.focus();
    });
  </script>

</body>
</html>
